<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 245, 247, 0.7) 0%, rgba(254, 240, 245, 0.7) 100%), 
                        url('images/background.jpeg') center/cover no-repeat;
            background-attachment: fixed;
            filter: blur(5px);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeIn 1s ease-in;
        }

        .header h1 {
            font-size: 48px;
            color: #d81b60;
            margin-top: 40px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header p {
            font-size: 20px;
            color: #c2185b;
            margin-bottom: 5px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #e91e63;
            opacity: 0.8;
        }

        /* SCROLLABLE MEMORIES SECTION */
        .memories-section {
            margin-bottom: 100px;
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.1);
        }

        .memories-title {
            font-size: 25px;
            color: #d81b60;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .memories-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
        }

        .memories-scroll::-webkit-scrollbar {
            height: 8px;
        }

        .memories-scroll::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }

        .memories-scroll::-webkit-scrollbar-thumb {
            background: #d81b60;
            border-radius: 10px;
        }

        .memory-item {
            flex: 0 0 280px;
            height: 250px;
            background: linear-gradient(135deg, #ffcdd2 0%, #f8bbd0 100%);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.15);
        }

        .memory-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.25);
        }

        .memory-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .memory-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: linear-gradient(135deg, #ffcdd2 0%, #f8bbd0 100%);
            color: rgba(255, 255, 255, 0.6);
        }

        /* PANELS SECTION */
        .panels-section {
            margin-bottom: 40px;
        }

        .panels-title {
            font-size: 20px;
            color: #d81b60;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
        }

        .panels-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .panel {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 100px;
        }

        .panel:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.3);
        }

        .panel.panel-pink {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
        }

        .panel.panel-red {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
        }

        .panel.panel-cream {
            background: linear-gradient(135deg, #fff8e1 0%, #ffe082 100%);
        }

        .panel-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .panel-title {
            font-size: 28px;
            font-weight: bold;
            color: #d81b60;
            margin-bottom: 10px;
        }

        .panel-text {
            font-size: 14px;
            color: #666;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .panel:nth-child(1) { animation-delay: 0.1s; }
        .panel:nth-child(2) { animation-delay: 0.2s; }
        .panel:nth-child(3) { animation-delay: 0.3s; }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }

            .panels-container {
                grid-template-columns: 1fr;
            }

            .memory-item {
                flex: 0 0 200px;
                height: 200px;
            }
        }

        /* FOOTER CREDIT */
        .website-footer {
            background: linear-gradient(135deg, #f8bbd0 0%, #ffcdd2 100%);
            padding: 20px 20px;
            text-align: center;
            margin-top: 20px;
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-bottom: -50px;
            padding-bottom: 20px;
        }

        .website-footer p {
            margin: 0;
            opacity: 0.8;
        }

        .website-footer p:hover {
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .panel-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .panel-image {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }

            .panels-container {
                grid-template-columns: 1fr;
            }

            .memory-item {
                flex: 0 0 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <script>
        function goToPage(page) {
            window.location.href = page;
        }

        // Smooth scroll untuk memories section
        const scrollSection = document.querySelector('.memories-scroll');
        if (scrollSection) {
            let isDown = false;
            let startX;
            let scrollLeft;

            scrollSection.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - scrollSection.offsetLeft;
                scrollLeft = scrollSection.scrollLeft;
            });

            scrollSection.addEventListener('mouseleave', () => {
                isDown = false;
            });

            scrollSection.addEventListener('mouseup', () => {
                isDown = false;
            });

            scrollSection.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - scrollSection.offsetLeft;
                const walk = (x - startX) * 1;
                scrollSection.scrollLeft = scrollLeft - walk;
            });
        }
    </script>
</body>
</html>
